<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCL.JS - Test &lt;vcl-text&gt;</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #f8fafc; color: #1a202c; }
        .hero-banner { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; padding: 24px 32px; border-radius: 12px; margin-bottom: 24px; }
        .test-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .console-container { background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; color: #38bdf8; font-family: monospace; padding: 16px; max-height: 180px; overflow-y: auto; }
    </style>
</head>
<body>
    <vcl-page title="Prueba &lt;vcl-text&gt;">
        <div class="hero-banner">
            <h1 style="margin:0;">🔤 Componente: &lt;vcl-text&gt;</h1>
            <p style="margin:6px 0 0 0; color:#94a3b8;">Migración de TText a HTML5 Custom Element Semántico.</p>
        </div>

        <div class="test-card">
            <vcl-text text="Encabezado H1 de Ejemplo" text-style="h1" text-color="#1a365d"></vcl-text>
            <vcl-text text="Encabezado H3 de Sección" text-style="h3" text-color="#2b6cb0"></vcl-text>
            <vcl-text text="Este es un texto destacado estilo lead con tipografía suave." text-style="lead"></vcl-text>
            <vcl-text text="Texto en formato de párrafo normal con alineación justificada o centrada." text-align="center"></vcl-text>
            <vcl-text text="Enlace dinámico a Google" href="https://www.google.com"></vcl-text>
        </div>

        <div class="console-container" id="console-log">
            <div>[SYS] Escuchando eventos vcl-click de &lt;vcl-text&gt;...</div>
        </div>
    </vcl-page>

    <script type="module">
        import '/web-components/index.ts';
        document.addEventListener('vcl-click', (e) => {
            if (e.target.tagName.toLowerCase() === 'vcl-text') {
                const log = document.getElementById('console-log');
                log.innerHTML = `<div>[${new Date().toLocaleTimeString()}] Evento vcl-click en &lt;vcl-text&gt;: text="${e.detail.text}"</div>` + log.innerHTML;
            }
        });
    </script>
</body>
</html>
