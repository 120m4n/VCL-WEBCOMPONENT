<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VCL.JS - Test &lt;vcl-row&gt; / &lt;vcl-col&gt;</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        <div class="test-card">

            </vcl-row>
            <vcl-row style="margin-top:12px;">
                <vcl-col span="4"><div class="demo-box">Col 4 (33.3%)</div></vcl-col>

    <script type="module">
        import '/web-components/index.ts';
    </script>

</html>
