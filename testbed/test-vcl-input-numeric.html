<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCL.JS - Test &lt;vcl-input-numeric&gt;</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #f8fafc; color: #1a202c; }
        .hero-banner { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; padding: 24px 32px; border-radius: 12px; margin-bottom: 24px; }
        .test-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .console-container { background: #0f172a; border-radius: 12px; border: 1px solid #1e293b; color: #38bdf8; font-family: monospace; padding: 16px; max-height: 180px; overflow-y: auto; }
    </style>
</head>
<body>
    <vcl-page title="Prueba &lt;vcl-input-numeric&gt;">
        <div class="hero-banner">
            <h1 style="margin:0;">🔢 Componente: &lt;vcl-input-numeric&gt;</h1>
            <p style="margin:6px 0 0 0; color:#94a3b8;">Migración de TInputNumeric con botones spinner incorporados (0% JQuery).</p>
        </div>

        <div class="test-card">
            <div style="display:flex; flex-direction:column; gap:12px;">
                <div>
                    <label style="font-size:13px; font-weight:600;">Cantidad Estándar (Step: 1, Min: 0, Max: 100):</label><br>
                    <vcl-input-numeric value="5" min="0" max="100" step="1"></vcl-input-numeric>
                </div>
                <div>
                    <label style="font-size:13px; font-weight:600;">Precio Decimal (Precision: 2, Step: 0.50):</label><br>
                    <vcl-input-numeric value="19.99" min="0" precision="2" step="0.5"></vcl-input-numeric>
                </div>
            </div>
        </div>

        <div class="console-container" id="console-log">
            <div>[SYS] Escuchando eventos vcl-change de &lt;vcl-input-numeric&gt;...</div>
        </div>
    </vcl-page>

    <script type="module">
        import '/web-components/index.ts';
        document.addEventListener('vcl-change', (e) => {
            if (e.target.tagName.toLowerCase() === 'vcl-input-numeric') {
                const log = document.getElementById('console-log');
                log.innerHTML = `<div>[${new Date().toLocaleTimeString()}] Evento vcl-change en &lt;vcl-input-numeric&gt;: value=${e.detail.value}</div>` + log.innerHTML;
            }
        });
    </script>
</body>
</html>
