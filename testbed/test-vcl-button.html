<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCL.JS — Test &lt;vcl-button&gt;</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px;
            font-family: 'Inter', system-ui, sans-serif;
            background: #f8fafc; color: #1a202c;
        }
        .hero {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: #fff; padding: 28px 32px; border-radius: 14px;
            margin-bottom: 28px; box-shadow: 0 12px 32px -6px rgba(0,0,0,0.2);
        }
        .hero h1 { margin: 0; font-size: 26px; font-weight: 700; }
        .hero p  { margin: 6px 0 0; color: #bfdbfe; font-size: 14px; }
        .card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
            padding: 24px; margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .card h2 {
            margin: 0 0 20px; font-size: 16px; font-weight: 600; color: #374151;
            border-bottom: 1px solid #e5e7eb; padding-bottom: 10px;
        }
        .row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .console-box {
            background: #0f172a; border-radius: 10px; padding: 16px;
            color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
            max-height: 180px; overflow-y: auto; line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="hero">
    <h1>🔘 &lt;vcl-button&gt;</h1>
    <p>Port de <code>TButton</code> · Botón nativo HTML5 con Shadow DOM y estilos encapsulados</p>
</div>

<!-- ── Test 1: Estilos de Botón ───────────────────────────────────────────── -->
<div class="card">
    <h2>1. Variantes de Estilo y Tamaño</h2>
    <div class="row">
        <vcl-button text="Normal"></vcl-button>
        <vcl-button text="Primario" button-style="primary"></vcl-button>
        <vcl-button text="Éxito" button-style="success"></vcl-button>
        <vcl-button text="Peligro" button-style="danger"></vcl-button>
        <vcl-button text="Grande" button-style="primary" button-size="lg"></vcl-button>
        <vcl-button text="Pequeño" button-style="primary" button-size="sm"></vcl-button>
        <vcl-button text="Deshabilitado" disabled></vcl-button>
    </div>
</div>

<!-- ── Test 2: Monitor de Eventos ────────────────────────────────────────── -->
<div class="card">
    <h2>2. Monitor de Eventos (<code>vcl-click</code>)</h2>
    <div class="console-box" id="console">
        <div>[SYS] Haz clic en cualquiera de los botones arriba...</div>
    </div>
</div>

<script type="module">
    import '/web-components/index.ts';

    const consoleEl = document.getElementById('console');

    document.addEventListener('vcl-click', (e) => {
        if (e.target.tagName === 'VCL-BUTTON') {
            const time = new Date().toLocaleTimeString();
            const txt = e.target.getAttribute('text') || 'Botón';
            const row = document.createElement('div');
            row.innerHTML = `[${time}] <span style="color:#f472b6;">vcl-click</span>: <b style="color:#4ade80;">text = "${txt}"</b>`;
            consoleEl.prepend(row);
        }
    });
</script>
</body>
</html>
