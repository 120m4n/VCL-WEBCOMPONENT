<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VCL.JS - Test &lt;vcl-alert&gt;</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #f8fafc; color: #1a202c; }
        .hero-banner { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; padding: 24px 32px; border-radius: 12px; margin-bottom: 24px; }
        .test-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; }
    </style>
</head>
<body>
    <vcl-page title="Prueba &lt;vcl-alert&gt;">
        <div class="hero-banner">
            <h1 style="margin:0;">⚠️ Componente: &lt;vcl-alert&gt;</h1>
            <p style="margin:6px 0 0 0; color:#94a3b8;">Migración de TAlert a Custom Element (0% JQuery).</p>
        </div>

        <div class="test-card">
            <vcl-alert alert-style="success" closable>Operación completada con éxito.</vcl-alert>
            <vcl-alert alert-style="warning">Advertencia: Su suscripción vence en 3 días.</vcl-alert>
            <vcl-alert alert-style="danger" closable>Error crítico al procesar la solicitud.</vcl-alert>
            <vcl-alert alert-style="info">Información: Los servidores estarán en mantenimiento hoy.</vcl-alert>
        </div>
    </vcl-page>

    <script type="module">
        import '/web-components/index.ts';
    </script>
</body>
</html>
