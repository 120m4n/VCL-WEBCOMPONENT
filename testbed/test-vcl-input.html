<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCL.JS — Test &lt;vcl-input&gt;</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 24px;
            font-family: 'Inter', system-ui, sans-serif;
            background: #f8fafc; color: #1a202c;
        }
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: #fff; padding: 28px 32px; border-radius: 14px;
            margin-bottom: 28px; box-shadow: 0 12px 32px -6px rgba(0,0,0,0.2);
        }
        .hero h1 { margin: 0; font-size: 26px; font-weight: 700; }
        .hero p  { margin: 6px 0 0; color: #bfdbfe; font-size: 14px; }
        .card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
            padding: 24px; margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .card h2 {
            margin: 0 0 20px; font-size: 16px; font-weight: 600; color: #374151;
            border-bottom: 1px solid #e5e7eb; padding-bottom: 10px;
        }
        .row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .row label { font-size: 12px; font-weight: 600; color: #6b7280; min-width: 130px; }
        .console-box {
            background: #0f172a; border-radius: 10px; padding: 16px;
            color: #38bdf8; font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
            max-height: 180px; overflow-y: auto; line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="hero">
    <h1>📝 &lt;vcl-input&gt;</h1>
    <p>Port de <code>TInput</code> · Entrada de texto nativa con validación y estados de formulario</p>
</div>

<div class="card">
    <h2>1. Variantes de Input</h2>
    <div class="row">
        <label>Texto Normal:</label>
        <vcl-input id="in-1" placeholder="Escribe algo..."></vcl-input>
    </div>
    <div class="row">
        <label>Con Valor Inicial:</label>
        <vcl-input id="in-2" value="Valor por defecto"></vcl-input>
    </div>
    <div class="row">
        <label>Deshabilitado:</label>
        <vcl-input id="in-3" value="No editable" disabled></vcl-input>
    </div>
</div>

<div class="card">
    <h2>2. Monitor de Eventos (<code>vcl-input</code>, <code>vcl-change</code>)</h2>
    <div class="console-box" id="console">
        <div>[SYS] Escribe en los campos de entrada...</div>
    </div>
</div>

<script type="module">
    import '/web-components/index.ts';

    const consoleEl = document.getElementById('console');

    function log(type, val) {
        const time = new Date().toLocaleTimeString();
        const row = document.createElement('div');
        row.innerHTML = `[${time}] <span style="color:#f472b6;">${type}</span>: <b style="color:#4ade80;">value = "${val}"</b>`;
        consoleEl.prepend(row);
    }

    document.addEventListener('vcl-input', (e) => {
        if (e.target.tagName === 'VCL-INPUT') log('vcl-input', e.detail.value);
    });

    document.addEventListener('vcl-change', (e) => {
        if (e.target.tagName === 'VCL-INPUT') log('vcl-change', e.detail.value);
    });
</script>
</body>
</html>
